name: Atualizar estatísticas

on:
  schedule:
    - cron: "0 */6 * * *"   # a cada 6 horas
  workflow_dispatch:         # botão manual na aba Actions
  push:
    paths:
      - "scripts/generate_stats.py"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerar cards
        env:
          GH_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
          GH_USER: analuizabirck
        run: python scripts/generate_stats.py

      - name: Commitar mudanças
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || (git commit -m "chore: atualiza estatísticas" && git push)
